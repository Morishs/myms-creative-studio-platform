🎨 Identité visuelle — logo, charte graphique, tout le branding

📱 Design digital — visuels pour Instagram, Facebook, LinkedIn…
📣 Community management — on gère vos réseaux de A à Z
📦 Ressources — templates et guides prêts à l'emploi

Quel domaine vous intéresse le plus ?`,links:[{label:"Tout voir en détail",href:"/services"}],options:[{label:"Le branding / logo",value:"branding"},{label:"Les réseaux sociaux",value:"digital"},{label:"Le community management",value:"communitymanagement"},{label:"J'ai besoin d'un devis",value:"devis"}]}],tarifs:()=>({content:Oi([`Alors, nos tarifs dépendent vraiment du projet, mais pour vous donner une idée :

📋 Identité visuelle complète — à partir de 150 000 FCFA
📄 Flyer ou affiche — à partir de 25 000 FCFA
📱 Pack visuels réseaux — à partir de 15 000 FCFA
📣 Community management — à partir de 100 000 FCFA/mois

Mais le mieux, c'est de nous décrire votre projet. On s'adapte toujours au budget du client. 😊`,`Bonne question ! Voici nos fourchettes de prix :

Un logo, ça démarre à 100 000 FCFA. Si vous voulez l'identité visuelle complète (logo + charte + papeterie), comptez à partir de 150 000 FCFA.

Pour du print (flyer, affiche…), c'est à partir de 25 000 FCFA. Et les visuels pour réseaux sociaux commencent à 15 000 FCFA le visuel.

Après, on discute et on s'adapte toujours à votre budget !`]),links:[{label:"Demander un devis précis",href:"/devis"}],options:[{label:"Vous avez des packs ?",value:"packs"},{label:"C'est quoi les délais ?",value:"delais"}]}),packs:[{content:`Oui, on propose des formules ! 📦

⭐ Pack Starter — quelques posts par mois pour maintenir une présence
💼 Pack Business — plus de contenus + stories
🚀 Pack Premium — gestion complète + publicités

Pour l'identité visuelle aussi, on a un pack complet qui va du logo jusqu'à la papeterie.

Dites-moi ce qui vous intéresse et je vous détaille !`,options:[{label:"Le community management",value:"communitymanagement"},{label:"L'identité visuelle",value:"branding"},{label:"Je veux un devis personnalisé",value:"devis"}]}],delais:()=>({content:Oi([`Les délais, c'est toujours la grande question ! 😄 Voilà ce qu'il faut prévoir :

Un logo, c'est environ 5-7 jours. Une identité visuelle complète, comptez 2-3 semaines. Pour un flyer ou une affiche, on peut faire ça en 3-5 jours.

Bien sûr, ça commence une fois le devis accepté et l'acompte reçu. Et si c'est urgent, on peut accélérer le rythme, il suffit de nous le dire !`,`Ça dépend du type de projet :

⚡ Logo — 5 à 7 jours
📋 Identité visuelle complète — 2 à 3 semaines
📄 Support print (flyer, affiche) — 3 à 5 jours
📱 Visuels réseaux sociaux — environ 1 semaine

Ces délais commencent après la validation du devis. Et on est flexibles : si vous avez une deadline serrée, dites-le nous, on fera tout pour la respecter !`]),options:[{label:"Comment ça se passe concrètement ?",value:"processus"},{label:"Je veux lancer mon projet",value:"devis"}]}),processus:[{content:`On fonctionne de façon simple et transparente. Voilà comment ça se passe :

1️⃣ Vous nous contactez et on discute de votre projet
2️⃣ On fait un brief détaillé ensemble pour bien cerner vos besoins
3️⃣ On vous envoie un devis clair, sans surprise
4️⃣ Vous validez et on démarre (avec un acompte de 50%)
5️⃣ On crée, on vous présente nos propositions
6️⃣ Vous donnez vos retours, on ajuste (2-3 révisions incluses)
7️⃣ On valide ensemble et on livre tous les fichiers

En gros, vous êtes impliqué à chaque étape. On ne fait rien sans votre avis ! 😊`,links:[{label:"Voir le processus en détail",href:"/processus"}],options:[{label:"Combien de révisions j'ai droit ?",value:"revision"},{label:"OK, je veux me lancer !",value:"devis"}]}],contact:()=>({content:Oi([`Bien sûr ! Vous pouvez nous joindre facilement :

📍 On est basés à ${rt.address}

On est disponibles du lundi au vendredi, de 9h à 18h. N'hésitez pas, on répond toujours rapidement ! 😉`,`Pour nous joindre, c'est simple :

Le plus rapide, c'est WhatsApp au ${rt.phone} — on répond généralement dans l'heure.

💬 "Combien de modifications je peux demander ?" — 2-3 révisions incluses
💬 "Vous livrez quels formats ?" — PNG, JPG, PDF, SVG, AI, PSD…

Je vous recommande vraiment d'aller y jeter un œil, ça vous donnera une bonne idée de notre style !`,links:[{label:"Découvrir le portfolio",href:"/portfolio"}],options:[{label:"Ça me plaît, je veux un devis",value:"devis"},{label:"Quels sont vos tarifs ?",value:"tarifs"}]}],revision:[{content:`Les révisions, c'est hyper important pour nous. On veut que vous soyez 100% satisfait.

En général, on inclut 2 à 3 révisions dans chaque projet. Ça veut dire qu'après la première proposition, vous pouvez demander des ajustements 2 ou 3 fois.

Si jamais ça ne suffit pas (ça arrive rarement 😅), les révisions supplémentaires sont facturées à part.

💡 Mon conseil : prenez le temps de bien rédiger votre brief au début, ça réduit beaucoup les allers-retours !`,options:[{label:"Comment se passe le brief ?",value:"processus"},{label:"OK, je veux commencer",value:"devis"}]}],paiement:[{content:`Côté paiement, on est assez flexibles :

📱 Mobile Money (Orange Money, Wave…) — c'est le plus utilisé par nos clients
🏦 Virement bancaire — pour les entreprises
💳 Carte bancaire — via Stripe, super pratique
💰 PayPal — pour les clients internationaux

À la livraison, vous recevez le logo dans tous les formats : PNG, JPG, SVG, PDF et même le fichier source AI.
