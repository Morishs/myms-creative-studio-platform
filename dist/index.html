Mais le mieux, c'est de nous décrire votre projet. On s'adapte toujours au budget du client. 😊`,`Bonne question ! Voici nos fourchettes de prix :

🚀 Pack Premium — gestion complète + publicités

Dites-moi ce qui vous intéresse et je vous détaille !`,options:[{label:"Le community management",value:"communitymanagement"},{label:"L'identité visuelle",value:"branding"},{label:"Je veux un devis personnalisé",value:"devis"}]}],delais:()=>({content:Ti([`Les délais, c'est toujours la grande question ! 😄 Voilà ce qu'il faut prévoir :

⚡ Logo — 5 à 7 jours
📋 Identité visuelle complète — 2 à 3 semaines
📄 Support print (flyer, affiche) — 3 à 5 jours
📱 Visuels réseaux sociaux — environ 1 semaine
